# Recette du moteur de calcul puis publication sur GitHub Pages.
# Réglage préalable : Settings > Pages > Source : GitHub Actions.
# Si un test échoue, la publication n'a pas lieu.
name: Recette et publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recette regard-maconnerie (comparaison au classeur)
        working-directory: regard-maconnerie
        run: node tests/run-tests.mjs
      # Copies generees depuis aedificium-ui a jour (audit du 10/11/2026, R12).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copies d'aedificium-ui a jour
        run: |
          git clone --depth 1 https://github.com/henri421/aedificium-ui "$RUNNER_TEMP/aedificium-ui"
          node "$RUNNER_TEMP/aedificium-ui/scripts/copier-projets.mjs" --verif "regard-maconnerie/js/feuilles" projets projets-stockage langue feuilles-dom

  publication:
    needs: recette
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: regard-maconnerie
      - id: deploy
        uses: actions/deploy-pages@v4
